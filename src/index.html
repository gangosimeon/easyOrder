<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <!-- CSP : limite l'exécution de script au bundle applicatif ('self') pour
       réduire l'impact d'une éventuelle XSS (le token d'auth vit en
       localStorage). connect-src inclut l'API backend, la détection de pays
       (ipapi.co/country.is) et le backend local de dev (localhost:4000).
       Note : frame-ancestors est ignoré par les navigateurs dans une balise
       meta — à définir via un header HTTP réel côté hébergeur si besoin. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https:; connect-src 'self' https://easyorder-backend-wnku.onrender.com https://api.jecreemaboutique.com http://localhost:4000 https://ipapi.co https://api.country.is; object-src 'none'; base-uri 'self'; form-action 'self'">
  <title>JeCreeMaBoutique — Créez votre boutique en ligne gratuitement</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- SEO Meta Tags -->
  <meta name="description" content="Créez votre boutique, partagez votre lien et commencez à vendre dès aujourd'hui. Gestion facile des produits, commandes via WhatsApp, boutique publique accessible 24/7.">
  <meta name="keywords" content="boutique en ligne, créer boutique, vendre en ligne, WhatsApp commerce, gestion boutique, e-commerce gratuit">
  <meta name="author" content="JeCreeMaBoutique">
  <meta name="robots" content="index, follow">

  <!-- Open Graph / Facebook / WhatsApp / Telegram -->
  <meta property="og:type"        content="website">
  <meta property="og:url"         content="https://www.jecreemaboutique.com/">
  <meta property="og:site_name"   content="JeCreeMaBoutique">
  <meta property="og:locale"      content="fr_FR">
  <meta property="og:title"       content="JeCreeMaBoutique — Créez votre boutique en ligne gratuitement">
  <meta property="og:description" content="Créez votre boutique, partagez votre lien et commencez à vendre dès aujourd'hui. Gestion facile des produits, commandes via WhatsApp.">
  <meta property="og:image"       content="https://www.jecreemaboutique.com/assets/icons/web-app-manifest-512x512.png">
  <meta property="og:image:width"  content="512">
  <meta property="og:image:height" content="512">
  <meta property="og:image:type"   content="image/png">
  <meta property="og:image:secure_url" content="https://www.jecreemaboutique.com/assets/icons/web-app-manifest-512x512.png">

  <!-- Twitter / X -->
  <meta name="twitter:card"        content="summary">
  <meta name="twitter:site"        content="@jecreemaboutique">
  <meta name="twitter:url"         content="https://www.jecreemaboutique.com/">
  <meta name="twitter:title"       content="JeCreeMaBoutique — Créez votre boutique en ligne gratuitement">
  <meta name="twitter:description" content="Créez votre boutique, partagez votre lien et commencez à vendre dès aujourd'hui. Gestion facile des produits, commandes via WhatsApp.">
  <meta name="twitter:image"       content="https://www.jecreemaboutique.com/assets/icons/web-app-manifest-512x512.png">

  <!-- Canonical URL -->
  <link rel="canonical" href="https://www.jecreemaboutique.com/">

  <!-- Favicons -->
  <link rel="icon"             type="image/x-icon" href="favicon.ico">
  <link rel="icon"             type="image/png" sizes="96x96"  href="assets/icons/favicon-96x96.png">
  <link rel="icon"             type="image/png" sizes="192x192" href="assets/icons/web-app-manifest-192x192.png">
  <link rel="icon"             type="image/png" sizes="512x512" href="assets/icons/web-app-manifest-512x512.png">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">

  <!-- PWA manifest -->
  <link rel="manifest" href="manifest.webmanifest">
  <!-- Couleur par défaut de la barre système (Android/TWA) — mise à jour dynamiquement
       par ThemeService selon la boutique visitée. Doit rester synchronisée avec
       theme_color dans manifest.webmanifest. -->
  <meta name="theme-color" content="#008060">

  <!-- JSON-LD : Organization → Google affiche le logo dans les résultats -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Organization",
    "name": "JeCreeMaBoutique",
    "url": "https://www.jecreemaboutique.com",
    "logo": {
      "@type": "ImageObject",
      "url": "https://www.jecreemaboutique.com/assets/icons/web-app-manifest-512x512.png",
      "width": 512,
      "height": 512
    },
    "sameAs": []
  }
  </script>

  <!-- JSON-LD : FAQPage → Google peut afficher les questions en résultat enrichi -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "FAQPage",
    "mainEntity": [
      {
        "@type": "Question",
        "name": "Qu’est-ce que JeCréeMaBoutique ?",
        "acceptedAnswer": { "@type": "Answer", "text": "JeCréeMaBoutique est une plateforme qui permet aux commerçants de créer facilement leur boutique en ligne, de présenter leurs produits et de permettre à leurs clients de les découvrir et de les contacter." }
      },
      {
        "@type": "Question",
        "name": "Comment créer ma boutique ?",
        "acceptedAnswer": { "@type": "Answer", "text": "Cliquez sur « Créer ma boutique » et renseignez les informations demandées. Vous pouvez commencer directement, sans avoir à créer un compte au préalable." }
      },
      {
        "@type": "Question",
        "name": "Dois-je créer un compte avant de créer ma boutique ?",
        "acceptedAnswer": { "@type": "Answer", "text": "Non. Vous pouvez commencer directement par la création de votre boutique." }
      },
      {
        "@type": "Question",
        "name": "Quelles sont les étapes pour créer ma boutique ?",
        "acceptedAnswer": { "@type": "Answer", "text": "Vous renseignez d’abord les informations de votre boutique, puis vous créez vos catégories, ajoutez vos produits, personnalisez votre boutique, configurez les options nécessaires et enfin publiez votre boutique." }
      },
      {
        "@type": "Question",
        "name": "Pourquoi dois-je créer des catégories ?",
        "acceptedAnswer": { "@type": "Answer", "text": "Les catégories permettent de mieux organiser vos produits et facilitent la navigation de vos clients. Par exemple : Vêtements, Chaussures, Accessoires, Électronique, etc." }
      },
      {
        "@type": "Question",
        "name": "Comment ajouter un produit ?",
        "acceptedAnswer": { "@type": "Answer", "text": "Après avoir créé vos catégories, vous pouvez ajouter vos produits avec leur nom, leurs photos, leur prix, leur description et leur catégorie." }
      },
      {
        "@type": "Question",
        "name": "Puis-je modifier ma boutique après sa publication ?",
        "acceptedAnswer": { "@type": "Answer", "text": "Oui. Vous pouvez mettre à jour les informations de votre boutique, vos catégories et vos produits afin de garder votre boutique à jour." }
      },
      {
        "@type": "Question",
        "name": "Mes clients peuvent-ils commander sur ma boutique ?",
        "acceptedAnswer": { "@type": "Answer", "text": "Oui. Votre boutique permet à vos clients de consulter vos produits et d’effectuer leurs demandes ou commandes selon les fonctionnalités configurées sur votre boutique." }
      },
      {
        "@type": "Question",
        "name": "Comment mes clients trouvent-ils ma boutique ?",
        "acceptedAnswer": { "@type": "Answer", "text": "Votre boutique dispose d’un lien que vous pouvez partager avec vos clients sur WhatsApp, Facebook, Instagram ou tout autre canal de communication." }
      },
      {
        "@type": "Question",
        "name": "Puis-je partager ma boutique sur WhatsApp ?",
        "acceptedAnswer": { "@type": "Answer", "text": "Oui. Vous pouvez partager facilement le lien de votre boutique avec vos clients et vos contacts WhatsApp." }
      },
      {
        "@type": "Question",
        "name": "Puis-je personnaliser ma boutique ?",
        "acceptedAnswer": { "@type": "Answer", "text": "Oui. Vous pouvez personnaliser différents éléments de votre boutique afin qu’elle corresponde à votre activité et à votre image." }
      },
      {
        "@type": "Question",
        "name": "Est-ce que je peux vendre différents types de produits ?",
        "acceptedAnswer": { "@type": "Answer", "text": "Oui. Vous pouvez créer des catégories adaptées à votre activité et y ajouter vos différents produits." }
      },
      {
        "@type": "Question",
        "name": "Puis-je utiliser JeCréeMaBoutique depuis mon téléphone ?",
        "acceptedAnswer": { "@type": "Answer", "text": "Oui. La plateforme est conçue pour être utilisée sur téléphone, tablette et ordinateur." }
      },
      {
        "@type": "Question",
        "name": "Que faire si j’ai besoin d’aide ?",
        "acceptedAnswer": { "@type": "Answer", "text": "Si vous rencontrez une difficulté lors de la création ou de la gestion de votre boutique, vous pouvez contacter notre équipe afin d’obtenir de l’aide." }
      },
      {
        "@type": "Question",
        "name": "Pourquoi créer une boutique en ligne ?",
        "acceptedAnswer": { "@type": "Answer", "text": "Votre boutique en ligne vous permet d’améliorer votre visibilité, de présenter vos produits à vos clients et de rester accessible même lorsque votre boutique physique est fermée." }
      }
    ]
  }
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&amp;family=Outfit:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
</head>
<body class="mat-typography">
  <app-root></app-root>
  <noscript>Please enable JavaScript to continue using this application.</noscript>
</body>
</html>
